<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>存哪儿 · 存款利率与国债</title>
  <meta name="description" content="国有大行挂牌利率、大额存单、储蓄国债、LPR 与历次调息，附利息计算器">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0a08;
      --panel: #16140f;
      --panel-2: #1e1b14;
      --hover: rgba(255,255,255,0.035);
      --line: rgba(255,255,255,0.07);
      --line-2: rgba(255,255,255,0.14);
      --text-1: #f3efe6;
      --text-2: #aaa293;
      --text-3: #6f685b;
      --accent: #f5b94a;
      --accent-2: #f08a3c;
      --grad: linear-gradient(120deg, #f8d27a 0%, #f5b94a 45%, #f08a3c 100%);
      --bond: #6fb8ff;
      --cd: #b58cff;
      --bank: #f5b94a;
      --other: #5fd3a4;
      --cut: #ff7a6b;
      --shadow: 0 0 0 1px var(--line), 0 12px 32px rgba(0,0,0,0.35);
    }
    :root[data-theme="light"] {
      --bg: #faf8f3;
      --panel: #ffffff;
      --panel-2: #f5f1e8;
      --hover: rgba(60,40,0,0.035);
      --line: rgba(60,40,0,0.09);
      --line-2: rgba(60,40,0,0.17);
      --text-1: #211c12;
      --text-2: #5f574a;
      --text-3: #9a917f;
      --accent: #c98a12;
      --accent-2: #d06a1c;
      --bond: #1f7ad6;
      --cd: #7d4fd6;
      --bank: #c98a12;
      --other: #1a9b6b;
      --cut: #d6463a;
      --shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(60,40,0,0.07);
    }
    body { background: var(--bg); color: var(--text-1); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; font-feature-settings: 'tnum' 1; min-height: 100vh; }
    body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(900px 420px at 15% -10%, rgba(245,185,74,0.10), transparent 70%); }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    input, select { font: inherit; color: var(--text-1); }

    .topbar { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
      background: color-mix(in srgb, var(--bg) 75%, transparent); border-bottom: 1px solid var(--line); }
    .topbar-inner { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
    .logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--grad); display: grid; place-items: center; font-size: 16px; }
    .logo small { font-weight: 500; color: var(--text-3); font-size: 12px; margin-left: 2px; }
    .nav { display: flex; gap: 4px; margin-left: 10px; }
    .nav a { padding: 6px 12px; border-radius: 8px; color: var(--text-2); font-size: 13px; font-weight: 500; white-space: nowrap; }
    .nav a:hover { color: var(--text-1); background: var(--hover); }
    .spacer { flex: 1; }
    .updated { font-size: 12px; color: var(--text-3); white-space: nowrap; }
    .icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--text-2); flex-shrink: 0; }
    .icon-btn:hover { color: var(--text-1); border-color: var(--line-2); }
    .icon-btn.spin svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .layout { max-width: 1200px; margin: 0 auto; padding: 24px 20px 64px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; }
    .aside { position: sticky; top: 76px; align-self: start; display: flex; flex-direction: column; gap: 14px; }
    .panel { background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); }
    .pad { padding: 18px 20px; }
    h2.sec { font-size: 17px; font-weight: 700; margin: 34px 0 12px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; scroll-margin-top: 80px; }
    h2.sec small { color: var(--text-3); font-weight: 500; font-size: 12.5px; }
    .hero h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
    .hero h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero p { color: var(--text-2); margin-top: 6px; }
    .alert { margin-top: 14px; padding: 12px 16px; border-radius: 12px; background: color-mix(in srgb, var(--cut) 12%, transparent); border: 1px solid color-mix(in srgb, var(--cut) 35%, transparent); font-size: 13.5px; }
    .alert b { color: var(--cut); }

    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
    .kpi { padding: 16px 18px; min-width: 0; display: flex; flex-direction: column; }
    .kpi .k { font-size: 12.5px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
    .kpi .k::before { content: ""; width: 8px; height: 8px; border-radius: 3px; background: var(--c); }
    .kpi .v { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; margin-top: 4px; white-space: nowrap; }
    .kpi .v small { font-size: 15px; font-weight: 500; color: var(--text-2); margin-left: 2px; }
    .kpi .s { font-size: 12px; color: var(--text-3); margin-top: 2px; }

    /* 计算器 */
    .calc { padding: 20px; display: grid; gap: 18px; }
    .calc-in { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; color: var(--text-3); font-weight: 500; }
    .input { display: flex; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; min-height: 44px; }
    .input:focus-within { border-color: var(--accent); }
    .input input { width: 180px; background: none; border: 0; outline: 0; padding: 10px 12px; font-size: 18px; font-weight: 700; }
    .input .unit { padding: 0 12px; color: var(--text-2); font-weight: 600; }
    .seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; min-height: 44px; align-items: center; }
    .seg button { padding: 7px 14px; border-radius: 8px; font-size: 13.5px; color: var(--text-2); font-weight: 500; }
    .seg button.on { background: var(--panel); color: var(--text-1); box-shadow: 0 0 0 1px var(--line-2); }
    .quick { display: flex; gap: 6px; }
    .quick button { font-size: 12px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-2); }
    .quick button:hover { color: var(--text-1); border-color: var(--line-2); }
    .bars { display: flex; flex-direction: column; gap: 10px; }
    .bar-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 130px; gap: 14px; align-items: center; }
    .bar-row .nm { font-size: 13.5px; font-weight: 500; }
    .bar-row .nm small { display: block; font-size: 11.5px; color: var(--text-3); font-weight: 400; }
    .bar-track { height: 26px; border-radius: 8px; background: var(--panel-2); overflow: hidden; position: relative; }
    .bar-fill { height: 100%; border-radius: 8px; background: var(--c); opacity: .85; transition: width .4s ease; }
    .bar-fill.best { opacity: 1; box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 40%, transparent); }
    .bar-row .val { text-align: right; font-size: 15px; font-weight: 700; }
    .bar-row .val small { display: block; font-size: 11.5px; color: var(--text-3); font-weight: 500; }
    .bar-row.na .bar-fill { opacity: .18; }
    .bar-row.na .val { color: var(--text-3); font-weight: 500; font-size: 12.5px; }
    .verdict { font-size: 14px; color: var(--text-2); padding: 12px 14px; border-radius: 10px; background: var(--panel-2); }
    .verdict b { color: var(--text-1); }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 14px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
    th { font-size: 12px; color: var(--text-3); font-weight: 600; }
    th:first-child, td:first-child { text-align: left; }
    tr:last-child td { border-bottom: 0; }
    td.best { color: var(--accent); font-weight: 700; }
    .table-wrap { overflow-x: auto; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 6px; background: var(--c); }
    .muted { color: var(--text-3); }
    .cut { color: var(--cut); }
    .tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--hover); color: var(--text-2); margin-left: 6px; }
    .tag.on { background: color-mix(in srgb, var(--bond) 16%, transparent); color: var(--bond); }

    /* 时间线 */
    .chart-box { padding: 18px 18px 10px; }
    .chart { position: relative; }
    .chart svg { width: 100%; height: 280px; display: block; overflow: visible; }
    .tip { position: absolute; pointer-events: none; background: var(--panel-2); box-shadow: var(--shadow); border-radius: 8px; padding: 6px 10px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -115%); display: none; }
    .legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-2); margin-top: 8px; flex-wrap: wrap; }
    .legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--c); vertical-align: middle; margin-right: 5px; }
    .changes { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 2px; scrollbar-width: thin; }
    .chg { flex-shrink: 0; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); min-width: 120px; }
    .chg .d { font-size: 12px; color: var(--text-3); }
    .chg .r { font-size: 16px; font-weight: 700; }
    .chg .r small { font-size: 12px; font-weight: 600; margin-left: 4px; }

    /* 国债 */
    .next { padding: 18px 20px; display: grid; grid-template-columns: auto 1fr; gap: 6px 24px; align-items: center; margin-bottom: 12px; }
    .next .cd { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; grid-row: span 2; color: var(--bond); }
    .next .cd small { font-size: 16px; font-weight: 600; color: var(--text-2); margin-left: 4px; }
    .next .t { font-size: 15px; font-weight: 600; }
    .next .s { font-size: 12.5px; color: var(--text-3); }

    .news-item { display: flex; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--line); align-items: baseline; }
    .news-item:last-child { border-bottom: 0; }
    .news-item:hover { background: var(--hover); }
    .news-item .t { flex: 1; min-width: 0; font-size: 14px; }
    .news-item:hover .t { color: var(--accent); }
    .news-item .m { font-size: 12px; color: var(--text-3); white-space: nowrap; }
    .chips { display: flex; gap: 6px; margin-bottom: 10px; }
    .chip { padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-2); font-size: 12.5px; }
    .chip.on { background: var(--text-1); color: var(--bg); border-color: var(--text-1); }

    .widget { padding: 16px; }
    .widget h3 { font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 10px; }
    .mini-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; gap: 8px; }
    .mini-row span:first-child { color: var(--text-2); }
    .note { font-size: 12px; color: var(--text-3); line-height: 1.7; }
    .note a { text-decoration: underline; text-underline-offset: 2px; }
    .ok { color: var(--other); } .bad { color: var(--cut); }

    @media (max-width: 980px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .aside { position: static; }
      .topbar-inner { flex-wrap: wrap; row-gap: 6px; }
      .nav { order: 10; width: 100%; margin-left: -8px; overflow-x: auto; scrollbar-width: none; }   /* 手机上导航挪到第二行，可横滑 */
      .nav a { white-space: nowrap; }
    }
    @media (max-width: 760px) {
      .topbar-inner { padding: 10px 16px; }
      .logo small, .updated { display: none; }
      .layout { padding: 16px 16px 50px; }
      .hero h1 { font-size: 21px; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .kpi .v { font-size: 24px; }
      .input input { width: 130px; }
      .bar-row { grid-template-columns: 96px minmax(0, 1fr) 92px; gap: 8px; }
      .bar-row .val { font-size: 13.5px; }
      .chart svg { height: 220px; }
      th, td { padding: 9px 10px; }
      .next .cd { font-size: 30px; }
    }
    /* ── 详情抽屉 + 列表页（通用组件 kit：电脑右侧滑出，手机底部升起；地址 #/item/类型/id、#/list/key） ── */
    :root { --kit-bg: var(--bg, #0b0a10); --kit-panel: var(--panel, var(--card, rgba(255,255,255,.04))); --kit-line: var(--line, var(--sep, rgba(255,255,255,.08)));
      --kit-line2: var(--line-2, rgba(255,255,255,.14)); --kit-t1: var(--text-1, #f1eff7); --kit-t2: var(--text-2, #a39fb3); --kit-t3: var(--text-3, #6b677a);
      --kit-accent: var(--accent, #a3e635); --kit-hover: var(--hover, rgba(255,255,255,.05)); }
    .kit-mask { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.38); display: none; }
    .kit-mask.open { display: block; }
    .kit-sheet { position: absolute; top: 12px; right: 12px; bottom: 12px; width: clamp(440px, 42vw, 620px); max-width: calc(100vw - 24px);
      display: flex; flex-direction: column; overflow: hidden; color: var(--kit-t1); border-radius: 18px;
      background: linear-gradient(var(--kit-panel), var(--kit-panel)), var(--kit-bg); box-shadow: 0 0 0 1px var(--kit-line2), 0 24px 60px rgba(0,0,0,.45);
      animation: kit-in .24s ease-out; }
    @keyframes kit-in { from { transform: translateX(40px); opacity: 0; } }
    .kit-sheet.kit-small { bottom: auto; }
    .kit-x { position: absolute; top: 12px; right: 12px; z-index: 3; width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
      background: rgba(0,0,0,.5); color: #fff; font-size: 15px; display: grid; place-items: center; }
    .kit-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
    .kit-cover { aspect-ratio: 16/9; background: var(--kit-hover) center / cover no-repeat; position: relative; }
    .kit-cover.tall { aspect-ratio: auto; height: 280px; background-size: contain; background-color: #000; }
    .kit-cover.ph { display: grid; place-items: center; font-size: 56px; aspect-ratio: 16/6; }
    .kit-head { padding: 18px 20px 4px; display: flex; gap: 14px; align-items: flex-start; }
    .kit-head .kit-thumb { flex-shrink: 0; width: 64px; height: 64px; border-radius: 14px; background: var(--kit-hover) center / cover no-repeat;
      display: grid; place-items: center; font-size: 28px; overflow: hidden; }
    .kit-head .kit-t { flex: 1; min-width: 0; padding-right: 30px; }
    .kit-cover + .kit-head .kit-t { padding-right: 0; }
    .kit-head h2 { font-size: 19px; font-weight: 800; line-height: 1.35; letter-spacing: -0.01em; }
    .kit-sub { color: var(--kit-t2); font-size: 13px; margin-top: 4px; }
    .kit-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .kit-tags span { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--kit-hover); color: var(--kit-t2); }
    .kit-big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .kit-big b { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
    .kit-body { padding: 4px 20px 20px; }
    .kit-sec { padding-top: 16px; }
    .kit-sec + .kit-sec { margin-top: 6px; border-top: 1px solid var(--kit-line); }
    .kit-sec h4 { font-size: 14.5px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .kit-sec h4 small { font-size: 12px; color: var(--kit-t3); font-weight: 500; }
    .kit-kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .kit-kv div { background: var(--kit-hover); border-radius: 10px; padding: 8px 11px; min-width: 0; }
    .kit-kv small { display: block; font-size: 11px; color: var(--kit-t3); }
    .kit-kv b { display: block; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
    .kit-p { font-size: 13.5px; line-height: 1.75; color: var(--kit-t2); white-space: pre-line; }
    .kit-rows { display: flex; flex-direction: column; }
    .kit-row { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--kit-line); font-size: 13px; text-decoration: none; color: inherit; }
    .kit-row:first-child { border-top: 0; }
    .kit-row[data-kit-go], a.kit-row { cursor: pointer; }
    .kit-row[data-kit-go]:hover .kit-rt, a.kit-row:hover .kit-rt { color: var(--kit-accent); }
    .kit-row .kit-rt { flex: 1; min-width: 0; line-height: 1.45; }
    .kit-row .kit-rm { color: var(--kit-t3); font-size: 12px; white-space: nowrap; }
    .kit-row img, .kit-row .kit-ri { width: 54px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--kit-hover); }
    .kit-acts { flex-shrink: 0; display: flex; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--kit-line); }
    .kit-acts a, .kit-acts button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 12px; border-radius: 11px;
      font: inherit; font-size: 13.5px; font-weight: 700; text-decoration: none; cursor: pointer; border: 1px solid var(--kit-line2); color: var(--kit-t1); background: transparent; }
    .kit-acts .pri { background: var(--kit-accent); border-color: var(--kit-accent); color: #111; }
    .kit-acts a:hover, .kit-acts button:hover { filter: brightness(1.08); }
    /* 列表页 */
    .kit-lhead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .kit-back { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--kit-line2); background: transparent; color: var(--kit-t1);
      font-size: 20px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
    .kit-back:hover { background: var(--kit-hover); }
    .kit-lhead h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .kit-lhead small { color: var(--kit-t3); font-size: 12.5px; margin-left: 2px; }
    .kit-lbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .kit-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .kit-chips a, .kit-chips button { padding: 5px 12px; border-radius: 8px; background: var(--kit-hover); color: var(--kit-t2); font: inherit; font-size: 13px;
      font-weight: 600; white-space: nowrap; border: 0; cursor: pointer; text-decoration: none; }
    .kit-chips .on { background: var(--kit-t1); color: var(--kit-bg); }
    .kit-chips small { opacity: .6; margin-left: 4px; font-weight: 500; }
    .kit-sel { padding: 6px 10px; border-radius: 9px; border: 1px solid var(--kit-line2); background: transparent; color: var(--kit-t1); font: inherit; font-size: 12.5px; font-weight: 600; }
    .kit-sel option { background: var(--kit-bg); }
    .kit-more { display: block; margin: 16px auto 0; padding: 9px 22px; border-radius: 10px; border: 1px solid var(--kit-line2); background: transparent;
      color: var(--kit-t1); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .kit-more:hover { background: var(--kit-hover); }
    .kit-morelink { font-size: 13px; font-weight: 600; color: var(--kit-t2); text-decoration: none; white-space: nowrap; cursor: pointer; }
    .kit-morelink:hover { color: var(--kit-t1); }
    [data-kit-item] { cursor: pointer; }
    @media (max-width: 760px) {
      .kit-sheet { top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-width: none; height: 86vh; border-radius: 18px 18px 0 0; animation: kit-up .26s ease-out; }
      @keyframes kit-up { from { transform: translateY(30%); opacity: .5; } }
      .kit-sheet.kit-small { height: auto; }
      .kit-head { padding: 16px 16px 4px; } .kit-body { padding: 4px 16px 18px; } .kit-acts { padding: 10px 16px 16px; }
      .kit-cover.tall { height: 220px; }
      .kit-head .kit-thumb { width: 46px; height: 46px; border-radius: 12px; font-size: 22px; }
      .kit-head h2 { font-size: 17.5px; }
      .kit-big b { font-size: 24px; }
      .kit-lhead h2 { font-size: 19px; }
    }
    /* 可点开详情的元素 */
    tr[data-kit-item]:hover td, .mini-row[data-kit-item]:hover { background: var(--hover); }
    .kpi[data-kit-item]:hover { box-shadow: 0 0 0 1px var(--line-2); }
    .mini-row[data-kit-item] { border-radius: 6px; }
    h2.sec .kit-morelink { margin-left: auto; }
    td.go { color: var(--text-3); text-align: right; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo"><div class="logo-mark">🏦</div>存哪儿<small>存款利率与国债</small></div>
      <nav class="nav"><a href="#calc">计算器</a><a href="#rates">利率对比</a><a href="#history">调息记录</a><a href="#bonds">储蓄国债</a><a href="#news">动态</a></nav>
      <div class="spacer"></div>
      <span class="updated" id="updated"></span>
      <button class="icon-btn" id="refresh" title="重新读取数据"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
      <a class="icon-btn" href="https://github.com/climb0516/savings-rates/actions/workflows/scrape.yml" target="_blank" rel="noopener" title="立即抓取（在 GitHub Actions 点 Run workflow）">⚡</a>
      <button class="icon-btn" id="theme" title="切换主题"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </header>

  <div class="layout">
    <main id="main"><div class="panel pad muted">加载中…</div></main>
    <aside class="aside" id="aside"></aside>
  </div>

<script>
// ── kit：详情抽屉 + 列表页路由（各站通用，内联在页面里）──
// 用法：
//   KIT.item('news', id => ({ title, sub, cover, thumb, tags:[], big, body:'<div class="kit-sec">…</div>', acts:[{text, href, pri}] }))
//   KIT.list('news', (param, query) => { … 把列表页 HTML 写进容器 … })
//   条目元素加 data-kit-item="news/<id>" 即可点击打开详情；「查看更多」写成 <a href="#/list/news">
//   站点首页渲染函数里先调用 KIT.route() —— 返回 true 表示当前是列表页（已渲染），首页不用再渲染
const KIT = (() => {
  const items = {}, lists = {};
  let mask, homeY = 0, fromHome = 0, lastHash = location.hash, onHome = null, listBox = null;
  const kesc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const parse = h => {
    const m = (h === undefined ? location.hash : h).match(/^#\/(item|list)\/([^?]+?)(?:\?(.*))?$/);
    if (!m) return null;
    const [type, ...rest] = m[2].split('/');
    return { kind: m[1], type: decodeURIComponent(type), id: rest.map(decodeURIComponent).join('/'), q: new URLSearchParams(m[3] || '') };
  };
  function ensure() {
    if (mask) return;
    mask = document.createElement('div');
    mask.className = 'kit-mask';
    mask.innerHTML = '<div class="kit-sheet" role="dialog" aria-modal="true"></div>';
    document.body.appendChild(mask);
    mask.addEventListener('click', e => { if (e.target === mask || e.target.closest('[data-kit-close]')) close(); });
  }
  function render(d) {
    ensure();
    const cover = d.cover ? `<div class="kit-cover ${d.coverTall ? 'tall' : ''}" style="background-image:url('${kesc(d.cover).replace(/'/g, '%27')}')"></div>`
      : d.coverIcon ? `<div class="kit-cover ph" style="background:${d.coverBg || 'var(--kit-hover)'}">${d.coverIcon}</div>` : '';
    const thumb = !d.cover && !d.coverIcon && (d.thumb || d.thumbIcon)
      ? `<div class="kit-thumb" style="${d.thumb ? `background-image:url('${kesc(d.thumb).replace(/'/g, '%27')}')` : ''}${d.thumbBg ? `;background-color:${d.thumbBg}` : ''}">${d.thumb ? '' : d.thumbIcon}</div>` : '';
    const acts = (d.acts || []).filter(a => a && (a.href || a.onclick));
    mask.firstElementChild.innerHTML = `<button class="kit-x" data-kit-close aria-label="关闭">✕</button>
      <div class="kit-scroll">${cover}
        <div class="kit-head">${thumb}<div class="kit-t"><h2>${kesc(d.title)}</h2>${d.sub ? `<div class="kit-sub">${d.sub}</div>` : ''}
          ${(d.tags || []).filter(Boolean).length ? `<div class="kit-tags">${d.tags.filter(Boolean).join('')}</div>` : ''}${d.big ? `<div class="kit-big">${d.big}</div>` : ''}</div></div>
        <div class="kit-body">${d.body || ''}</div></div>
      ${acts.length ? `<div class="kit-acts">${acts.map((a, i) => a.href
        ? `<a class="${a.pri || (i === 0 && acts.length < 3) ? 'pri' : ''}" href="${kesc(a.href)}" ${a.self ? '' : 'target="_blank" rel="noopener"'}>${a.text}</a>`
        : `<button class="${a.pri ? 'pri' : ''}" data-kit-act="${i}">${a.text}</button>`).join('')}</div>` : ''}`;
    acts.forEach((a, i) => { if (!a.href) { const b = mask.querySelector(`[data-kit-act="${i}"]`); if (b) b.onclick = a.onclick; } });
    mask.firstElementChild.classList.toggle('kit-small', !!d.small);       // 内容很少的提示：抽屉按内容高度
    mask.querySelector('.kit-scroll').scrollTop = 0;
    mask.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  // 打开详情：写进地址（可分享；浏览器返回 = 关闭）
  function open(key) {
    const target = '#/item/' + key;
    if (location.hash === target) return show(parse(target));
    ensure();
    if (parse()?.kind === 'item') history.replaceState(history.state, '', target);
    else { mask.dataset.base = location.hash; history.pushState({ kit: 1 }, '', target); }
    lastHash = target;
    show(parse(target));
  }
  function show(r) {
    const fn = items[r.type];
    const d = fn && fn(r.id, r.q);
    // 找不到这一条（已下榜 / 过期 / 链接是旧数据里的）：给个提示，而不是什么都不弹
    render(d || { small: true, title: '这条内容已不在当前数据里', sub: '数据每天自动更新，它可能已经下榜、过期或被合并到别的条目', thumbIcon: '🕓',
      body: KIT.p('可以回到首页看最新的内容，或用页面顶部的搜索找一找。'), acts: [{ text: '回到首页', href: '#', self: true, pri: true }] });
    return !!d;
  }
  function close(silent) {
    if (!mask || !mask.classList.contains('open')) return;
    mask.classList.remove('open');
    document.body.style.overflow = '';
    if (!silent && parse()?.kind === 'item') {
      if (history.state && history.state.kit) history.back();          // 从页面里点开的：退回去
      else { history.replaceState(null, '', mask.dataset.base || location.pathname + location.search); lastHash = location.hash; }   // 直接打开的分享链接
    }
  }
  // 当前地址是列表页时渲染列表页并返回 true；首页时返回 false
  function route(box) {
    if (box) listBox = box;
    const r = parse();
    if (r && r.kind === 'list' && lists[r.type]) { lists[r.type](r.id, r.q, listBox); return true; }
    return false;
  }
  // 列表页的公共外壳：返回按钮 + 标题 + 子分类 + 排序
  function shell({ title, note, chips, sort, sortVal, body, more }) {
    return `<div class="kit-lhead"><button class="kit-back" data-kit-back title="返回">‹</button><h2>${kesc(title)}</h2>${note ? `<small>${note}</small>` : ''}</div>
      ${chips || sort ? `<div class="kit-lbar"><div class="kit-chips">${(chips || []).map(c => `<a class="${c.on ? 'on' : ''}" href="${kesc(c.href)}">${kesc(c.text)}${c.count != null ? `<small>${c.count}</small>` : ''}</a>`).join('')}</div>
        ${sort ? `<select class="kit-sel" data-kit-sort>${sort.map(([v, n]) => `<option value="${kesc(v)}" ${v === sortVal ? 'selected' : ''}>${kesc(n)}</option>`).join('')}</select>` : ''}</div>` : ''}
      ${body}${more ? `<button class="kit-more" data-kit-more>${more}</button>` : ''}`;
  }
  function init(home) {
    onHome = home;
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-kit-item],[data-kit-go],[data-kit-back]');
      if (!t) return;
      const inner = e.target.closest('a[href],button,input,select,label,summary');   // 卡片里的其它按钮 / 链接（关注、复制…）优先
      if (inner && inner !== t && t.contains(inner)) return;
      e.preventDefault();
      if (t.dataset.kitBack !== undefined) { fromHome && history.length > fromHome ? history.go(-fromHome) : (location.hash = ''); return; }
      open(t.dataset.kitItem || t.dataset.kitGo);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    window.addEventListener('hashchange', () => {
      const r = parse();
      let was = parse(lastHash), steps = 1;
      if (was && was.kind === 'item') {                                 // 从详情离开
        const base = mask && mask.dataset.base !== undefined ? mask.dataset.base : '';
        if (location.hash === base) { lastHash = location.hash; close(true); return; }   // 只是关掉详情，底下页面不动
        was = parse(base); steps = 2;                                   // 在详情里点了别的列表：按详情底下那页算，返回要退两步
      }
      lastHash = location.hash;
      if (r && r.kind === 'item') { show(r); return; }
      close(true);
      const wasHome = !was;
      if (r && r.kind === 'list') {
        if (wasHome) { homeY = scrollY; fromHome = steps; }
        onHome && onHome();
        if (wasHome || was.type !== r.type) scrollTo(0, 0);
      } else {
        onHome && onHome();
        if (fromHome) { scrollTo(0, homeY); fromHome = 0; }
      }
    });
    // 直接打开带 #/item/ 的链接（比如大屏跳过来）：页面数据读完后由站点调用 KIT.boot()
  }
  function boot() { const r = parse(); if (r && r.kind === 'item') show(r); }
  return { item: (t, fn) => (items[t] = fn), list: (t, fn) => (lists[t] = fn), open, close, route, shell, init, boot, parse, esc: kesc,
    // 小工具：详情里的键值格、段落、关联列表
    kv: rows => { const r = rows.filter(x => x && x[1] != null && x[1] !== ''); return r.length ? `<div class="kit-kv">${r.map(([k, v]) => `<div><small>${kesc(k)}</small><b title="${kesc(v)}">${kesc(v)}</b></div>`).join('')}</div>` : ''; },
    sec: (title, html, note) => html ? `<div class="kit-sec"><h4>${title}${note ? `<small>${note}</small>` : ''}</h4>${html}</div>` : '',
    p: t => t ? `<p class="kit-p">${kesc(t)}</p>` : '',
  };
})();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('sv:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sv:' + k, JSON.stringify(v)); } catch {} },
};
const state = { amount: store.get('amount', 100000), term: store.get('term', 3), topic: 'all' };
let D = null;

// ── 工具 ──
const fmtMoney = v => v.toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const fmtRate = v => v == null ? '—' : v.toFixed(2) + '%';
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const todayISO = () => new Date(Date.now() + 8 * 3600000).toISOString().slice(0, 10);   // 北京时间
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' 分钟前';
  if (s < 86400) return Math.round(s / 3600) + ' 小时前';
  return Math.round(s / 86400) + ' 天前';
}
const md = iso => iso ? `${+iso.slice(5, 7)}月${+iso.slice(8, 10)}日` : '';

// 最新一轮国债利率（按期限）
function bondRates() {
  const r = {};
  for (const b of D.bonds) for (const i of b.items) if (!(i.term in r)) r[i.term] = { rate: i.rate, start: b.start, kind: b.kind };
  return r;
}
// 下期国债：已有公告且未结束的优先；否则按「3–11 月每月 10 日」推算
function nextBond() {
  const today = todayISO();
  const live = D.bonds.find(b => b.start && b.end && b.start <= today && today <= b.end);
  if (live) return { status: 'live', bond: live };
  const announced = D.bonds.filter(b => b.start > today).sort((a, b) => a.start.localeCompare(b.start))[0];
  if (announced) return { status: 'announced', bond: announced, date: announced.start };
  let y = +today.slice(0, 4), m = +today.slice(5, 7);
  if (+today.slice(8, 10) > 10) m++;
  if (m > 11 || m < 3) { if (m > 11) y++; m = 3; }
  return { status: 'expected', date: `${y}-${String(m).padStart(2, '0')}-10` };
}

// ── 渠道与计算 ──
function channels(term) {
  const dep = D.deposit.rates, cd = D.cd?.rates || {}, br = bondRates(), others = D.others?.groups || [];
  const key = term + '年';
  const list = [
    { id: 'bank', name: '国有大行定期', sub: '整存整取挂牌', rate: dep[key], c: 'var(--bank)' },
    { id: 'cd', name: '大额存单', sub: `中行常规 · ${fmtMoney((D.cd?.min_amount || 200000) / 10000)} 万起`, rate: cd[key], c: 'var(--cd)',
      na: state.amount < (D.cd?.min_amount || 200000) ? `需 ${fmtMoney((D.cd?.min_amount || 200000) / 10000)} 万起` : null },
    { id: 'bond', name: '储蓄国债', sub: '凭证式 / 电子式', rate: br[term]?.rate, c: 'var(--bond)', na: br[term] ? null : '只有 3 年、5 年期' },
    ...others.map((g, i) => ({ id: 'o' + i, name: g.name + '（参考）', sub: g.remark?.slice(0, 18) || '', rate: g.rates?.[key], c: 'var(--other)' })),
  ];
  return list.map(x => ({ ...x, na: x.na || (x.rate == null ? '无此期限' : null), interest: x.rate == null ? 0 : state.amount * x.rate / 100 * term }));
}

// ── 视图 ──
function render() {
  renderAside();
  if (KIT.route($('#main'))) return;                     // #/list/… 列表页
  const dep = D.deposit, br = bondRates(), cd = D.cd, nb = nextBond();
  const stableDays = daysBetween(dep.date, todayISO());
  const lpr = D.lpr?.[0];
  const ch = D.rate_change?.date && daysBetween(D.rate_change.detected, new Date().toISOString()) <= 30 ? D.rate_change : null;
  const prev = D.deposit_history[1];
  const nbText = nb.status === 'live' ? '发售中' : `${daysBetween(todayISO(), nb.date)} 天后`;

  $('#main').innerHTML = `
    <section class="hero">
      <h1>钱<em>存哪儿</em>利息最高？</h1>
      <p>国有大行挂牌利率、大额存单、储蓄国债和中小银行参考，一页对比，附利息计算器。</p>
      ${ch ? `<div class="alert"><b>调息提醒</b>：中国银行发布了 ${esc(ch.date)} 起执行的新存款利率表，三年期 ${fmtRate(prev?.rates['3年'])} → <b>${fmtRate(dep.rates['3年'])}</b>。</div>` : ''}
    </section>
    <div class="kpis">
      <div class="panel kpi" style="--c:var(--bank)" data-kit-item="rate/0"><span class="k">大行 3 年定期</span><span class="v">${dep.rates['3年'].toFixed(2)}<small>%</small></span><span class="s">${md(dep.date)}起执行 · 已 ${stableDays} 天未调</span></div>
      <div class="panel kpi" style="--c:var(--cd)" data-kit-item="cd/0"><span class="k">大额存单 3 年</span><span class="v">${cd?.rates['3年']?.toFixed(2) ?? '—'}<small>%</small></span><span class="s">中行常规 · 20 万起</span></div>
      <div class="panel kpi" style="--c:var(--bond)" data-kit-item="bond/0"><span class="k">储蓄国债 3 / 5 年</span><span class="v">${br[3]?.rate.toFixed(2) ?? '—'}<small>/ ${br[5]?.rate.toFixed(2) ?? '—'}%</small></span><span class="s">免利息税 · 发行即抢光</span></div>
      <div class="panel kpi" style="--c:var(--accent-2)" data-kit-item="${nb.bond ? 'bond/' + D.bonds.indexOf(nb.bond) : 'next/0'}"><span class="k">下期国债</span><span class="v">${nbText}</span><span class="s">${nb.status === 'live' ? `${md(nb.bond.start)}–${md(nb.bond.end)} · ${nb.bond.kind}` : `${md(nb.date)} ${nb.status === 'expected' ? '（预计）' : '开售'}`}</span></div>
    </div>

    <h2 class="sec" id="calc">利息计算器<small>按单利估算，到期一次性拿到的利息</small></h2>
    <div class="panel calc">
      <div class="calc-in">
        <div class="field"><label>存多少</label><div class="input"><input id="amount" type="text" inputmode="numeric" value="${esc(state.amount)}"><span class="unit">元</span></div></div>
        <div class="field"><label>存几年</label><div class="seg">${[1, 2, 3, 5].map(t => `<button data-term="${t}" class="${state.term === t ? 'on' : ''}">${t} 年</button>`).join('')}</div></div>
        <div class="field"><label>快捷金额</label><div class="quick">${[[50000, '5 万'], [100000, '10 万'], [200000, '20 万'], [500000, '50 万']].map(([v, l]) => `<button data-amount="${v}">${l}</button>`).join('')}</div></div>
      </div>
      <div class="bars" id="bars"></div>
      <div class="verdict" id="verdict"></div>
    </div>

    <h2 class="sec" id="rates">利率对比<small>年利率，单位 %</small></h2>
    <div class="panel"><div class="table-wrap">${rateTable()}</div></div>

    <h2 class="sec" id="history">调息记录<small>中国银行人民币存款挂牌利率，${D.deposit_history.length} 次调整</small><a class="kit-morelink" href="#/list/history">全部 ${D.deposit_history.length} 次 →</a></h2>
    <div class="panel chart-box">
      <div class="chart" id="chart">${chartSVG()}<div class="tip" id="tip"></div></div>
      <div class="legend"><span style="--c:var(--bank)"><i></i>大行 3 年定期</span><span style="--c:var(--accent-2)"><i></i>大行 1 年定期</span><span style="--c:var(--bond)"><i></i>储蓄国债 3 年</span></div>
      <div class="changes" style="margin-top:14px">${changesList()}</div>
    </div>

    <h2 class="sec" id="bonds">储蓄国债<small>来自中国银行销售公告 · 每年 3–11 月每月 10 日开售</small><a class="kit-morelink" href="#/list/bonds">全部 ${D.bonds.length} 期 →</a></h2>
    <div class="panel next" data-kit-item="${nb.bond ? 'bond/' + D.bonds.indexOf(nb.bond) : 'next/0'}">
      <div class="cd">${nb.status === 'live' ? '发售中' : daysBetween(todayISO(), nb.date)}${nb.status === 'live' ? '' : '<small>天</small>'}</div>
      <div class="t">${nb.status === 'live' ? `${esc(nb.bond.title.replace('销售公告', ''))}` : nb.status === 'announced' ? `${md(nb.date)} 开售 · ${esc(nb.bond.title.replace('销售公告', ''))}` : `预计 ${md(nb.date)} 开售`}</div>
      <div class="s">${nb.status === 'expected' ? '以财政部公告为准（通常提前几天发布）。凭证式到银行网点买，电子式在手机银行买，热门时几分钟售罄，建议开售当天 8:30 前准备好。' : `${md(nb.bond?.start)}–${md(nb.bond?.end)} · ${nb.bond?.kind} · ${nb.bond?.kind === '凭证式' ? '银行网点购买，到期一次还本付息' : '手机银行 / 网银购买，按年付息'}`}</div>
    </div>
    <div class="panel"><div class="table-wrap">${bondTable()}</div></div>

    <h2 class="sec" id="news">最新动态<a class="kit-morelink" href="#/list/news${state.topic === 'all' ? '' : '?topic=' + encodeURIComponent(state.topic)}">查看更多 →</a></h2>
    <div class="chips">${[['all', '全部'], ['国债', '国债'], ['存款', '存款利率'], ['大额存单', '大额存单']].map(([k, l]) => `<button class="chip ${state.topic === k ? 'on' : ''}" data-topic="${k}">${l}</button>`).join('')}</div>
    <div class="panel">${newsRows(D.news.filter(n => state.topic === 'all' || n.topic === state.topic).slice(0, 8))}</div>
    <p class="note" style="margin-top:14px">数据仅供参考，不构成理财建议。实际利率以银行网点、App 或财政部公告为准；大额存单和国债额度有限，不同地区可能不同。</p>
  `;
  renderCalc();
  bindChart();
}

function renderAside() {
  const dep = D.deposit, lpr = D.lpr?.[0];
  const abcOk = D.abc && ['1年', '3年', '5年'].every(k => D.abc.rates[k] === dep.rates[k]);
  $('#aside').innerHTML = `
    <div class="panel widget">
      <h3 data-kit-item="lpr/0" style="cursor:pointer;display:flex">📈 贷款市场报价利率 LPR <span class="muted" style="margin-left:auto">走势 ›</span></h3>

function renderCalc() {
  const list = channels(state.term);
  const valid = list.filter(x => !x.na);
  const max = Math.max(...valid.map(x => x.interest), 1);
  const best = valid.reduce((a, b) => b.interest > (a?.interest ?? -1) ? b : a, null);
  const bank = list.find(x => x.id === 'bank');
  $('#bars').innerHTML = list.map(x => `<div class="bar-row ${x.na ? 'na' : ''}" style="--c:${x.c}">
      <span class="nm">${esc(x.name)}<small>${esc(x.sub)}</small></span>
      <div class="bar-track"><div class="bar-fill ${x === best ? 'best' : ''}" style="width:${x.na ? 100 : x.interest / max * 100}%"></div></div>
      <span class="val">${x.na ? esc(x.na) : `+${fmtMoney(x.interest)}<small>${fmtRate(x.rate)}</small>`}</span></div>`).join('');
  $('#verdict').innerHTML = best && bank && !bank.na
    ? `${fmtMoney(state.amount)} 元存 ${state.term} 年：放<b>${esc(best.name)}</b>利息最多，<b>${fmtMoney(best.interest)} 元</b>，比大行定期多 <b>${fmtMoney(best.interest - bank.interest)} 元</b>。${best.id.startsWith('o') ? '（中小银行为参考利率，需确认当地实际报价和起存条件）' : ''}`
    : '';
}

function rateTable() {

    ...others.map(g => [g.name + '（参考）', 'var(--other)', t => g.rates?.[t]])];

// 阶梯折线：调息是阶跃变化，用水平 + 垂直线段
let CH = null;
function chartSVG() {
  const h = [...D.deposit_history].reverse();
  const bonds = [...D.bonds].reverse().filter(b => b.start && b.items.find(i => i.term === 3)).map(b => ({ date: b.start, v: b.items.find(i => i.term === 3).rate }));
  const today = todayISO();
  const t0 = new Date(h[0].date).getTime(), t1 = new Date(today).getTime();
  const vals = [...h.flatMap(x => [x.rates['3年'], x.rates['1年']]), ...bonds.map(b => b.v)];
  const W = 820, H = 280, L = 8, R = 44, T = 10, B = 24, max = Math.ceil(Math.max(...vals)), min = 0;
  const x = d => L + (new Date(d).getTime() - t0) / (t1 - t0) * (W - L - R);
  const y = v => T + (1 - (v - min) / (max - min)) * (H - T - B);
  const step = (pts, key) => pts.map((p, i) => `${i ? `H${x(p.date).toFixed(1)}V` : `M${x(p.date).toFixed(1)},`}${y(key(p)).toFixed(1)}`).join('') + `H${x(today).toFixed(1)}`;
  CH = { h, x, y, W, H };
  const grid = Array.from({ length: max + 1 }, (_, v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${W - R + 6}" y="${y(v) + 4}" font-size="11" fill="var(--text-3)">${v}%</text>`).join('');
  const years = []; for (let yr = new Date(h[0].date).getFullYear() + 1; yr <= +today.slice(0, 4); yr += 2) years.push(yr);
  const ticks = years.map(yr => `<text x="${x(yr + '-01-01')}" y="${H - 6}" font-size="11" fill="var(--text-3)" text-anchor="middle">${yr}</text>`).join('');
  const dots = h.map(p => `<circle cx="${x(p.date)}" cy="${y(p.rates['3年'])}" r="3" fill="var(--bank)"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" id="csvg">${grid}${ticks}
    <path d="${step(h, p => p.rates['1年'])}" fill="none" stroke="var(--accent-2)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <path d="${step(h, p => p.rates['3年'])}" fill="none" stroke="var(--bank)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    ${bonds.length ? `<path d="${step(bonds, p => p.v)}" fill="none" stroke="var(--bond)" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>` : ''}
    ${dots}<line id="cross" y1="${T}" y2="${H - B}" stroke="var(--line-2)" visibility="hidden"/></svg>`;
}
function bindChart() {
  const box = $('#chart'), svg = $('#csvg'), tip = $('#tip');
  if (!box || !CH) return;
  const move = e => {
    const r = svg.getBoundingClientRect(), cx = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) / r.width * CH.W;
    let cur = CH.h[0];
    for (const p of CH.h) if (CH.x(p.date) <= cx) cur = p;
    tip.innerHTML = `${esc(cur.date)} 起<br>三年 <b>${cur.rates['3年'].toFixed(2)}%</b> · 一年 ${cur.rates['1年'].toFixed(2)}% · 活期 ${cur.rates['活期'].toFixed(2)}%`;
    tip.style.display = 'block';
    tip.style.left = Math.min(r.width - 120, Math.max(120, cx / CH.W * r.width)) + 'px';
    tip.style.top = (CH.y(cur.rates['3年']) / CH.H * r.height) + 'px';
    const c = $('#cross'); c.setAttribute('x1', cx); c.setAttribute('x2', cx); c.setAttribute('visibility', 'visible');
  };
  box.addEventListener('mousemove', move); box.addEventListener('touchmove', move, { passive: true });
  box.addEventListener('mouseleave', () => { tip.style.display = 'none'; $('#cross').setAttribute('visibility', 'hidden'); });
}

// ── 交互 ──
document.addEventListener('click', e => {
  const t = e.target.closest('[data-term],[data-amount],[data-topic]');
  if (!t) return;
  if (t.dataset.term) { state.term = +t.dataset.term; store.set('term', state.term); document.querySelectorAll('[data-term]').forEach(b => b.classList.toggle('on', b === t)); renderCalc(); }
  if (t.dataset.amount) { state.amount = +t.dataset.amount; store.set('amount', state.amount); $('#amount').value = state.amount; renderCalc(); }
  if (t.dataset.topic) { state.topic = t.dataset.topic; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'amount') return;
  state.amount = +e.target.value.replace(/[^\d]/g, '') || 0;
  store.set('amount', state.amount);
  renderCalc();
});
function applyTheme(t) { document.documentElement.dataset.theme = t; }
applyTheme(store.get('theme', 'dark'));
$('#theme').addEventListener('click', () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; applyTheme(t); store.set('theme', t); render(); });

async function load() {
  $('#refresh').classList.add('spin');
  try {
    D = await fetch('data.json', { cache: 'no-cache' }).then(r => r.json());   // no-cache：更新后刷新即可见
    render();
    KIT.boot();
  } catch (e) {
    if (!D) $('#main').innerHTML = '<div class="panel pad">数据加载失败，请稍后刷新</div>';
  } finally { $('#refresh').classList.remove('spin'); }
}
$('#refresh').addEventListener('click', load);
KIT.init(render);
load();
</script>
</body>
